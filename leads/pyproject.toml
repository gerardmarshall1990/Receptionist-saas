[project]
name = "leads-engine"
version = "0.1.0"
description = "Frontdesk leads engine: builds a verified, scored, compliant database of small businesses likely to buy an AI receptionist."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0",
    "fastapi>=0.165.0",
    "httpx>=0.28",
    "lxml>=6.1.3",
    "phonenumbers>=9.0.43",
    "psycopg[binary,pool]>=3.2",
    "pyarrow>=26.0.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "timezonefinder>=9.2.0",
    "tldextract>=5.4.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
leads = "leads_engine.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leads_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests hold data tables and build SQL from tmp paths they created themselves.
# ...and the browser test starts node with fixed arguments.
"tests/**" = ["S101", "S105", "S106", "S608", "E501", "S603", "S607"]
# Markdown report: long literal table/prose strings.
"src/leads_engine/universe/report.py" = ["E501"]
"src/leads_engine/explorer/bench.py" = ["E501"]
# Regex rule tables and report SQL read best unwrapped.
"src/leads_engine/crawl/extract.py" = ["E501"]
"src/leads_engine/crawl/report.py" = ["E501"]
"src/leads_engine/crawl/store.py" = ["E501", "S608"]
"src/leads_engine/scoring/run.py" = ["E501"]
"src/leads_engine/compliance/export.py" = ["E501"]
"src/leads_engine/experiment/*.py" = ["E501"]
"src/leads_engine/experiment_commands.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = ["db: needs a Postgres reachable at TEST_DATABASE_URL"]
