# LLM roles. Model names are config: override per run with LEADS_SCORING_MODEL /
# LEADS_OPENER_MODEL. Nothing calls a model in Stage 0; these drive cost
# projections now and the T3/T5 jobs later. `leads config validate` prints the
# projected spend for a 3M universe from these numbers.
version: 1

# T3: scores only the top ~10% after rule-based pre-scoring (spec section 2).
# The spec asks for a cheap model here: Claude Haiku 5.5.
scoring:
  provider: anthropic
  model: claude-haiku-5-5
  effort: low
  max_output_tokens: 2000
  input_usd_per_mtok: 0.10
  output_usd_per_mtok: 0.50
  est_input_tokens: 3000   # stored signals + evidence snippets + rubric
  est_output_tokens: 800   # JSON {pain, value, reachability, fit, reasons[], disqualifiers[]} + thinking
  prices_checked_on: "2026-11-19"

# T5: writes an evidence-grounded opener + "why this lead" for the top ~1-2%.
# The spec asks for a stronger model here: Claude Opus 5.5.
opener:
  provider: anthropic
  model: claude-opus-5-5
  effort: medium
  max_output_tokens: 4000
  input_usd_per_mtok: 4.00
  output_usd_per_mtok: 20.00
  est_input_tokens: 2500
  est_output_tokens: 800   # one sentence + summary; thinking can't be turned off on this model
  prices_checked_on: "2026-11-19"
