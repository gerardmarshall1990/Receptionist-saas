# Stage 2 crawler + signal rules. Politeness limits are floors, not targets:
# lowering delays or raising per-site pages needs a reason in docs/DECISIONS.md.
version: 1

# No contact link: the user chose not to publish one. Do not put personal data here.
user_agent: "FrontdeskLeadsBot/0.1"
robots_agent: "FrontdeskLeadsBot"

concurrency_sites: 32        # different sites fetched in parallel
per_site_delay_s: 2.0        # minimum gap between two requests to the same site
max_pages_per_site: 5        # homepage + up to 4 chosen internal pages
max_bytes: 2000000           # stop reading a response beyond this
timeout_s: 15
max_redirects: 5
max_attempts: 3              # network errors only; blocks are never retried

# Internal pages worth fetching, by link text or URL path. Highest score first,
# at most one page per kind.
link_kinds:
  contact: [contact, contact-us, "get in touch", reach us]
  booking: [book, booking, schedule, appointment, request service, request-service]
  careers: [career, careers, jobs, employment, hiring, join our team, join-our-team]
  about: [about, about-us, our story, who we are, our team, meet the team]
  services: [services, our services, what we do]
link_kind_priority: [contact, booking, careers, about, services]

# Bot-protection / challenge pages. A hit marks the site "blocked": we stop and
# never retry or evade (spec section 7).
block_markers:
  - "just a moment..."
  - "attention required! | cloudflare"
  - "cf-browser-verification"
  - "captcha"
  - "px-captcha"
  - "are you a robot"
  - "access denied"
  - "request unsuccessful. incapsula"
  - "ddos protection by"

# Parked / for-sale domains: the website doesn't work for this business.
parked_markers:
  - "this domain is for sale"
  - "domain is for sale"
  - "buy this domain"
  - "this domain may be for sale"
  - "parked free, courtesy of"
  - "domain has expired"
  - "hugedomains.com"
  - "sedoparking"

# Script/iframe/link signatures (lowercase substrings of the raw HTML).
