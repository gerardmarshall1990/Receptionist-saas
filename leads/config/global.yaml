# Live Google reviews in the explorer: Place Details calls allowed per calendar month.
# 1,000 = Google's free monthly usage cap for this SKU (so $0 by default). Each call
# beyond the free cap costs ~$0.025. Reviews are shown live, never stored.
google_places_monthly_cap: 1000

# Stage 1 pilot: rows per category loaded into Postgres (stratified random,
# whole US). The full extract stays in Parquet.
pilot_sample:
  plumbing: 8000
  hvac: 6000
  dental: 6000

# Categories to test later; not configured yet (spec section 1).
watch_list:
  - veterinary
  - med_spa_salon
  - property_management
  - locksmith_towing_garage_door
  - real_estate_agency

open_questions:
  - "Day-of-week and holiday calling restrictions per state (some states restrict Sundays/holidays). Needs counsel."
  - "AI-voice outbound rules (FCC treats AI-generated voices as 'artificial' under TCPA): what consent is required for B2B calls to landlines vs mobiles? Needs counsel before Stage 5."
  - "Is the 3M target the universe (T0) or the exported, verified set? This config assumes universe."
