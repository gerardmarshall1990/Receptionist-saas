# Global rules that apply across every category. Versioned: bump `version` on
# any change so runs record which rules they used (config_hash also changes).
version: 1

# Rollout order per spec section 0. Only US is enabled until Stage 7.
countries_enabled: [US]
# Universe size the cost projections assume (spec: ~3M across US/CA/AU/UK).
universe_target: 3000000
# Overture Maps release used for T0. Bumping it requires re-running
# `leads universe census` and re-confirming category codes.
overture_release: "2026-11-18.0"

# No category may schedule calls outside these local-time bounds (the
# business's own timezone). Federal TCPA allows 8am-9pm; several state
# mini-TCPA laws are stricter (e.g. 8pm end), so the bound is the stricter one.
# This is an engineering guard rail, NOT legal advice: counsel must confirm
# before any calling (spec section 7). Day-of-week/holiday rules: OPEN.
calling_hours_hard_bounds:
  earliest: "08:00"
  latest: "20:00"
  note: "Conservative intersection of TCPA and the strictest state rules known; counsel to confirm per state and country."

# Matched case-insensitively against name + site text for every category.
# A hit means "exclude" (spec section 1: shops, travel agencies, chains,
# large employers; section 4: already has an answering service).
global_exclusion_keywords:
  - answering service
  - virtual receptionist
  - ai receptionist
  - 24/7 live answering
  - call center
  - franchise opportunities
  - "own a franchise"
  - travel agency
  - nationwide locations
  - "locations nationwide"
  # Government bodies (their .gov sites are not used as exclusions, see normalize.py)
  - veterans affairs
  - va medical center
  - va clinic
  - department of
  - health department

# Answering-service / AI-receptionist vendor names. A mention on the business's
# own site means the need is already solved -> exclude (spec section 4).
# SEED LIST, INCOMPLETE; grow it from crawl data in Stage 2.
answering_vendor_patterns:
  - ruby receptionists
  - smith.ai
  - answerconnect
  - patlive
  - abby connect
  - nexa receptionists
  - answerforce
  - dialzara
  - goodcall
  - my ai front desk

# Chain detection and dedupe thresholds (Stage 1). Starting values; tune from
# the Stage 1 report's "top repeated names / domains" tables.
chain_detection:
  use_brand_wikidata: true
  chain_min_locations: 10
  multi_location_min: 2
  shared_phone_max: 3
  name_repeat_review_cities: 10
  # ...and at least this share of those listings point at one website.
  name_network_min_domain_share: 0.5

