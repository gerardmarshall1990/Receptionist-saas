# Garage door repair and installation. Tier 1 niche pilot (2026-11). Hypotheses until outcomes re-rank them.
slug: garage_door
label: Garage door repair
rank: 10
pilot_phase: null
niche_knowledge_slug: null
value_weight: 0.75
why_converts:
  - "A broken spring traps the car: the homeowner calls until someone answers."
  - "Techs are on ladders all day; small shops miss calls while installing."
  - "Repairs are $200-$600 and new doors $1,500+, so one saved call covers the price."

source_codes:
  status: confirmed
  overture_release: "2026-11-18.0"
  osm: ["craft=garage_door"]
  note: "Census 2026-11-18.0: garage_door_service 17,450 US places; door_sales_service (4,183) is sales and excluded."

subcategories:
  - slug: garage_door_service
    label: "Garage door service"
    include: true
    overture_codes: [garage_door_service]
  - slug: door_sales
    label: "Door sales"
    include: false
    overture_codes: [door_sales_service]
    reason: "Showroom/sales, not urgent service calls."

pain_keywords:
  - same day service
  - emergency garage door
  - broken spring
  - 24/7
  - call now
  - leave a message
  - we'll call you back

review_pain_keywords:
  - never answers
  - went to voicemail
  - voicemail
  - couldn't get through
  - never called back
  - hard to reach

negative_keywords:
  - live dispatcher 24/7
  - our dispatchers answer 24/7

exclusions:
  chain_name_patterns:
    - overhead door company
    - precision door service
    - precision garage door
  chain_name_contains:
    - home depot
    - lowe's
  keywords:
    - door manufacturer
    - wholesale
  note: "Seed list; Overhead Door and Precision Door are franchise networks. Review the chain table in the universe report."

staff_target: {min: 1, typical: 4, max: 20, hard_max: 50}

best_call_windows:
  - days: [mon, tue, wed, thu, fri]
    start: "08:00"
    end: "09:00"
    why: "Before the first install."
  - days: [mon, tue, wed, thu, fri]
    start: "15:30"
    end: "17:30"
    why: "Winding down after the last job."

opener_templates:
  - id: emergency_repair
    requires_signal: emergency_247_claim
    template: "I saw {name} offers emergency repairs, so when a spring snaps at 7am and you're on a ladder, who picks up the phone?"
  - id: leave_a_message
    requires_signal: leave_message_text
    template: "Your site asks callers to leave a message, and someone with a stuck door usually calls the next company instead."
  - id: hiring_front_desk
    requires_signal: hiring_receptionist
    template: "I noticed {name} is hiring someone to answer phones, and we can cover every call starting this week while you look."
  - id: phone_only
    requires_signal: phone_only_booking
    template: "It looks like the only way to book {name} is by phone, so every missed call is a missed job."

open_questions:
  - "Value weight 0.75 is a guess; new-door sales raise ticket value."
