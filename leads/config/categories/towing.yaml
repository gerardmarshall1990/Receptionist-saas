# Towing and roadside. Tier 1 niche pilot (2026-11). Weights/windows are hypotheses until outcomes re-rank them.
slug: towing
label: Towing and roadside assistance
rank: 9
pilot_phase: null
niche_knowledge_slug: null
value_weight: 0.65
why_converts:
  - "A stranded driver calls the next tow company the moment a call rings out."
  - "Drivers are on the road; small companies juggle dispatch on a cell phone."
  - "Accident and heavy-duty tows pay hundreds to thousands per call."

source_codes:
  status: confirmed
  overture_release: "2026-11-18.0"
  osm: ["service:vehicle:towing=yes"]
  note: "Census 2026-11-18.0: towing_service 26,451 US places (primary)."

subcategories:
  - slug: towing
    label: "Towing"
    include: true
    overture_codes: [towing_service]

pain_keywords:
  - 24/7
  - 24 hour
  - roadside assistance
  - emergency towing
  - call now
  - leave a message
  - we'll call you back

review_pain_keywords:
  - never answers
  - went to voicemail
  - voicemail
  - couldn't get through
  - never called back
  - hard to reach

negative_keywords:
  - our dispatchers answer 24/7
  - live dispatcher 24/7
  - 24/7 dispatch center

exclusions:
  chain_name_patterns:
    - honk
    - urgently
  chain_name_contains:
    - roadside assistance network
  keywords:
    - impound lot
    - police impound
    - auto auction
  note: "Seed list; motor clubs and app-based dispatch networks are not small operators."

staff_target: {min: 1, typical: 4, max: 20, hard_max: 50}

best_call_windows:
  - days: [mon, tue, wed, thu, fri]
    start: "10:00"
    end: "12:00"
    why: "After the morning commute surge."
  - days: [mon, tue, wed, thu, fri]
    start: "13:30"
    end: "15:30"
    why: "Before the evening commute."

opener_templates:
  - id: emergency_towing
    requires_signal: emergency_247_claim
    template: "I saw {name} offers round-the-clock towing, so when a call comes in at 3am while your drivers are out, who answers it?"
  - id: leave_a_message
    requires_signal: leave_message_text
    template: "Your site asks callers to leave a message, and a stranded driver usually calls the next tow company instead."
  - id: hiring_dispatch
    requires_signal: hiring_receptionist
    template: "I noticed {name} is hiring for dispatch or phones, and we can answer every call starting this week while you hire."
  - id: phone_only
    requires_signal: phone_only_booking
    template: "It looks like the only way to get a tow from {name} is by phone, so every missed call goes to a competitor."

open_questions:
  - "Value weight 0.65 is a guess; police-rotation and motor-club work changes the economics."
  - "Do towing companies that run their own 24/7 dispatch still buy overflow answering?"
