# Septic service (pumping, repair, installation). Tier 1 niche pilot (2026-11). Hypotheses until outcomes.
slug: septic
label: Septic service
rank: 12
pilot_phase: null
niche_knowledge_slug: null
value_weight: 0.75
why_converts:
  - "A backed-up septic system is an emergency: the homeowner calls until someone answers."
  - "Owner-operators are out in the truck pumping tanks all day."
  - "Pumping is $300-$700 and repairs or new systems run into the thousands."

source_codes:
  status: confirmed
  overture_release: "2026-11-18.0"
  osm: ["craft=septic_service"]
  note: "Census 2026-11-18.0: septic_service 5,693 US places (primary). Drain cleaning has no own code (it sits under plumbing)."

subcategories:
  - slug: septic
    label: "Septic service"
    include: true
    overture_codes: [septic_service]

pain_keywords:
  - 24/7
  - emergency septic
  - emergency service
  - backup
  - call now
  - leave a message
  - we'll call you back

review_pain_keywords:
  - never answers
  - went to voicemail
  - voicemail
  - couldn't get through
  - never called back
  - hard to reach

negative_keywords:
  - live dispatcher 24/7
  - our dispatchers answer 24/7

exclusions:
  chain_name_patterns:
    - roto-rooter
    - mr. rooter
    - mr rooter
  chain_name_contains:
    - county health
    - health department
    - water authority
  keywords:
    - septic supply
    - wholesale
    - portable toilet rental
  note: "Overture files this code under public_utility; government offices are dropped by the keyword list."

staff_target: {min: 1, typical: 4, max: 20, hard_max: 50}

best_call_windows:
  - days: [mon, tue, wed, thu, fri]
    start: "08:00"
    end: "09:00"
    why: "Before or between the first pump-outs."
  - days: [mon, tue, wed, thu, fri]
    start: "15:30"
    end: "17:30"
    why: "Back from the last pump-out."

opener_templates:
  - id: emergency_backup
    requires_signal: emergency_247_claim
    template: "I saw {name} offers emergency septic service, so when a backup call comes in while you're out pumping a tank, who picks up?"
  - id: leave_a_message
    requires_signal: leave_message_text
    template: "Your site asks callers to leave a message, and someone with a backed-up system usually calls the next company instead."
  - id: hiring_front_desk
    requires_signal: hiring_receptionist
    template: "I noticed {name} is hiring someone to answer phones, and we can cover every call starting this week while you look."
  - id: phone_only
    requires_signal: phone_only_booking
    template: "It looks like the only way to book {name} is by phone, so every missed call is a missed job."

open_questions:
  - "Small universe (~5.7k): is septic worth its own category or a plumbing subcategory?"
