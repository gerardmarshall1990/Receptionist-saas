# Electrical. Spec rank 3. Not in the pilot.
slug: electrical
label: Electrical
rank: 3
pilot_phase: null
niche_knowledge_slug: null   # no niche file in the main app yet
value_weight: 0.70
why_converts:
  - "Outages and sparking/burning smells are urgent calls."
  - "Owner-operators are common and are on the job, not at a desk."
  - "Panel upgrades, EV chargers and rewires are mid-to-high ticket."

source_codes:
  status: confirmed
  overture_release: "2026-11-18.0"
  osm: ["craft=electrician"]
  note: "Codes confirmed in docs/reports/taxonomy-2026-11-18.0.md."

subcategories:
  - slug: electrician
    label: "Electrician"
    include: true
    overture_codes: [electrician]
  - slug: electrical_supply
    label: "Electrical supply/wholesale"
    include: false
    overture_codes: [electrical_supply_store, electrical_wholesaler]
    reason: "Shop/wholesaler."

pain_keywords:
  - 24/7
  - 24 hour
  - emergency electrician
  - emergency service
  - power outage
  - after hours
  - leave a message
  - we'll call you back
  - call for a free estimate
  - call now

review_pain_keywords:
  - never answers
  - went to voicemail
  - voicemail
  - couldn't get through
  - called multiple times
  - hard to reach
  - never called back
  - didn't call back

negative_keywords:
  - live dispatcher 24/7

exclusions:
  # SEED LISTS, INCOMPLETE. Matched on the normalized name (see ICP.md).
  # chain_name_patterns: brand at the START of the name. Generic-sounding brands
  # ("Gentle Dental", "Comfort Dental") are left to the website-domain rule,
  # because many independents share those words.
  chain_name_patterns:
    - mister sparky
    - mr. electric
  chain_name_contains:
    - home depot
  keywords:
    - electrical supply
    - wholesale
    - distributor
  note: ""

staff_target: {min: 1, typical: 4, max: 15, hard_max: 40}

best_call_windows:
  - days: [mon, tue, wed, thu, fri]
    start: "08:00"
    end: "09:00"
    why: "Before the first job."
  - days: [mon, tue, wed, thu, fri]
    start: "16:00"
    end: "18:00"
    why: "After jobs wrap."

opener_templates:
  - id: emergency_after_hours
    requires_signal: emergency_247_claim
    template: "I saw {name} offers emergency service, so when someone's power goes out at night and you're mid-job, who answers?"
  - id: leave_a_message
    requires_signal: leave_message_text
    template: "Your site asks callers to leave a message, and a lot of people with an urgent electrical problem won't wait for a call back."
  - id: phone_only
    requires_signal: phone_only_booking
    template: "It looks like the only way to book {name} is by phone, so every call you miss on a job is a quote you don't get to give."

open_questions:
  - "No niche knowledge file exists for electrical in the main app; needed before the AI receptionist sells here."
  - "Value weight 0.70 is a guess."
