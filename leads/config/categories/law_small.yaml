# Small law firms: personal injury, family, criminal defense. Spec rank 6.
slug: law_small
label: Small law firms (PI, family, criminal defense)
rank: 6
pilot_phase: null
niche_knowledge_slug: null
value_weight: 0.95
why_converts:
  - "Each new client is worth thousands (PI cases often far more), so one saved call pays for a year."
  - "Callers in a crisis (arrest, accident, divorce) don't leave voicemail; they call the next firm."
  - "Many urgent calls come evenings and weekends."

source_codes:
  status: confirmed
  overture_release: "2026-11-18.0"
  osm: ["office=lawyer"]
  note: "113k US firms carry only the generic attorney code; their practice area is classified from the website in Stage 2."

subcategories:
  - slug: personal_injury
    label: "Personal injury"
    include: true
    overture_codes: [personal_injury_law]
  - slug: family_law
    label: "Family/divorce"
    include: true
    overture_codes: [divorce_and_family_law]
  - slug: criminal_defense
    label: "Criminal defense / DUI"
    include: true
    overture_codes: [criminal_defense_law, dui_law]
  - slug: practice_unknown
    label: "Law firm, practice area not coded"
    include: true
    overture_codes: [attorney_or_law_firm]
    reason: "Kept until the website shows the practice area; non-target areas are dropped in Stage 2."
  - slug: immigration
    label: "Immigration"
    include: false
    overture_codes: [immigration_law]
    reason: "Not in spec; OPEN QUESTION."
  - slug: estate_planning
    label: "Estate/wills/probate"
    include: false
    overture_codes: [wills_trusts_and_probate, estate_planning_law]
    reason: "Not in spec; OPEN QUESTION."
  - slug: other_practice
    label: "Other practice areas"
    include: false
    overture_codes: [bankruptcy_law, employment_law, business_law, real_estate_law, general_litigation, tax_law, medical_law, disability_law, social_security_law, ip_and_internet_law, patent_law, workers_compensation_law, contract_law, tenant_and_eviction_law, civil_rights_lawyer]
    reason: "Not in spec."
  - slug: not_a_law_firm
    label: "Legal-adjacent services"
    include: false
    overture_codes: [legal_service, notary_public, bail_bonds_service, private_investigation, paralegal_service, process_server, court_reporter, mediator]
    reason: "Not attorneys, or too generic to tell."

pain_keywords:
  - free consultation
  - call now
  - call today
  - available 24/7
  - 24/7
  - evenings and weekends
  - leave a message
  - we'll call you back
  - we will return your call
  - arrested
  - injured

review_pain_keywords:
  - never answers
  - never returned my call
  - never called back
  - went to voicemail
  - voicemail
  - couldn't get through
  - couldn't reach
  - hard to reach
  - called multiple times

negative_keywords:
  - intake team available 24/7
  - legal intake center

exclusions:
  # SEED LISTS, INCOMPLETE. Matched on the normalized name (see ICP.md).
  # chain_name_patterns: brand at the START of the name. Generic-sounding brands
  # ("Gentle Dental", "Comfort Dental") are left to the website-domain rule,
  # because many independents share those words.
  chain_name_patterns:
    - "morgan & morgan"
    - morgan and morgan
    - "jacoby & meyers"
    - legalzoom
    - rocket lawyer
    - legalshield
  chain_name_contains: []
  keywords:
    - legal aid
    - public defender
    - law school
    - attorney general
    - district attorney
    - lawyer referral service
  note: "Legal aid, government offices and referral services are not buyers."

staff_target: {min: 1, typical: 4, max: 15, hard_max: 30}

best_call_windows:
  - days: [tue, wed, thu]
    start: "08:00"
    end: "09:30"
    why: "Before court and client meetings."
  - days: [mon, tue, wed, thu]
    start: "16:00"
    end: "17:30"
    why: "After court."

opener_templates:
  - id: after_hours
    requires_signal: emergency_247_claim
    # The signal fires on emergency/urgent wording with or without 24/7: claim only urgent help.
    template: "I saw {name} offers urgent help, so when a new client calls at night or while you're in court, who answers?"
  - id: leave_a_message
    requires_signal: leave_message_text
    template: "Your site asks callers to leave a message, and someone who was just in an accident usually calls the next firm instead."
  - id: hard_to_reach_reviews
    requires_signal: review_hard_to_reach
    template: "A review for {name} mentions calls not being returned, and we make sure every caller gets a live answer."

open_questions:
  - "Include immigration and estate planning? Currently excluded per spec."
  - "AI intake for law firms touches attorney-client privilege and unauthorized-practice rules: can the receptionist qualify cases, or only take messages?"
  - "No law niche knowledge file in the main app yet."
